<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login — Controle de Empréstimo de Equipamentos</title>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg,#1b2a4a,#2f6fb0); margin:0; height:100vh; display:flex; align-items:center; justify-content:center; }
  .box { background: white; padding: 40px 44px; border-radius: 12px; width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
  .box h1 { font-size: 19px; color: #1b2a4a; margin: 0 0 4px; }
  .box p.sub { font-size: 13px; color: #64748b; margin: 0 0 22px; }
  label { display:block; font-size: 13px; font-weight: 600; color:#334155; margin: 14px 0 6px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
  button { width: 100%; margin-top: 22px; background: #2f6fb0; color: white; border: none; padding: 11px; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .icon { font-size: 28px; margin-bottom: 8px; }
</style>
</head>
<body>
  <div class="box">
    <div class="icon">📦</div>
    <h1>Controle de Empréstimo de Equipamentos</h1>
    <p class="sub">Acesse com sua matrícula institucional</p>
    <form action="/dashboard" method="get">
      <label>Matrícula</label>
      <input type="text" placeholder="2026ADS001" value="2026ADS001">
      <label>Senha</label>
      <input type="password" placeholder="••••••••" value="••••••••">
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
